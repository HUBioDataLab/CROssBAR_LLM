# Runs the /llm-staging deployment on the server, next to the untouched /llm one.
#
#   docker compose -f docker-compose.staging.yml pull
#   docker compose -f docker-compose.staging.yml up -d
#
# Host ports must differ from the ones the /llm container already uses; point the
# reverse proxy's /llm-staging routes at them (see Dockerfile header).

services:
  crossbar-llm-staging:
    image: ghcr.io/hubiodatalab/crossbar_llm:staging
    container_name: crossbar-llm-staging
    restart: unless-stopped
    env_file: ./staging.env           # secrets; never commit (see .env.example)
    environment:
      APP_ENV: production
    ports:
      - "127.0.0.1:${STAGING_API_PORT:-8010}:8000"   # -> /llm-staging/api
      - "127.0.0.1:${STAGING_WEB_PORT:-8511}:8501"   # -> /llm-staging
    volumes:
      - ./staging-logs:/app/crossbar_llm/agent_tools/logs
