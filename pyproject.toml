[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossbar-llm"
version = "0.1.0"
requires-python = "==3.12.11"
dependencies = [
    "aiolimiter>=1.2.1",
    "cyver==2.0.2",
    "fastapi[standard]==0.138.2",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "langchain==1.3.14",
    "langchain-anthropic==1.4.8",
    "langchain-core==1.5.0",
    "langchain-google-genai==4.2.6",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai==1.4.0",
    "langchain-openrouter==0.2.5",
    "langgraph==1.2.6",
    "neo4j==6.2.0",
    "numpy>=2.5.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
    "pyyaml==6.0.3",
    "slowapi==0.1.10",
    "structlog==26.1.0",
    "typing-extensions==4.15.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
]
